name = "okay-lean"
version = "0.1.0"
defaultTargets = ["Okay"]
testDriver = "test"

[[lean_lib]]
name = "Okay"

# the tests' and the conformance worker's modules, imported by the executables below
[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "test"
root = "Tests.Main"

[[lean_exe]]
name = "stack"
root = "Probe.Stack"

[[lean_exe]]
name = "lean-worker"
root = "Tests.ConformanceWorker"
